<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Photo Tracing">
    <title>Photo Tracing App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            position: fixed;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
            position: relative;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .camera-view {
            flex: 1;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-placeholder {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #333 0%, #111 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #666;
            text-align: center;
            padding: 40px;
        }

        .reference-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.5;
            object-fit: cover;
            pointer-events: none;
        }

        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 20;
            gap: 10px;
        }

        .btn-small {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            flex-shrink: 0;
            cursor: pointer;
        }

        .btn-small:active {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(0.95);
        }

        .btn-small.danger {
            background: rgba(255, 59, 48, 0.6);
        }

        .btn-small.danger:active {
            background: rgba(255, 59, 48, 0.9);
        }

        .icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .bottom-controls {
            padding: 20px 16px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.8));
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .message {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 0;
        }

        .slider-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 14px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
        }

        .slider-container.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slider-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .slider-input {
            width: 100%;
            height: 5px;
            border-radius: 2px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.4);
        }

        .slider-input::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #007AFF;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.4);
        }

        .opacity-value {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .controls-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
        }

        .btn-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            transition: all 0.2s;
            background: rgba(128, 128, 128, 0.6);
            color: white;
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-circle:active {
            transform: scale(0.9);
            background: rgba(128, 128, 128, 0.8);
        }

        .btn-capture {
            width: 70px;
            height: 70px;
            background: white;
            box-shadow: 0 0 0 3px white;
            opacity: 0.7;
        }

        .btn-capture:active {
            opacity: 1;
            box-shadow: 0 0 0 4px white;
        }

        .file-input {
            display: none;
        }

        .status-message {
            position: fixed;
            top: 20px;
            left: 16px;
            right: 16px;
            background: #333;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            animation: fadeInOut 2.5s;
            z-index: 1000;
        }

        .status-message.show {
            display: block;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .info-section {
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid rgba(0, 122, 255, 0.3);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.5;
        }

        .info-section strong {
            color: #007AFF;
            display: block;
            margin-bottom: 6px;
        }

        @media (max-width: 600px) {
            .btn-small {
                font-size: 12px;
                padding: 8px 12px;
            }

            .controls-buttons {
                gap: 20px;
            }

            .btn-circle {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }

            .btn-capture {
                width: 64px;
                height: 64px;
                box-shadow: 0 0 0 2px white;
            }

            .camera-placeholder {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="screen">
            <!-- Camera View -->
            <div class="camera-view">
                <div class="camera-placeholder">📷 Camera View</div>
                <img id="referenceImage" class="reference-overlay" alt="Reference">
                
                <!-- Top Controls -->
                <div class="top-controls">
                    <button class="btn-small" onclick="openImagePicker()">
                        <span class="icon">📷</span>
                        <span>Add Ref</span>
                    </button>
                    <button class="btn-small danger" id="clearBtn" style="display: none;" onclick="clearReference()">
                        <span class="icon">✕</span>
                        <span>Clear</span>
                    </button>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <!-- Slider Container -->
                <div class="slider-container" id="sliderContainer">
                    <div class="slider-label">
                        <span class="icon">✏️</span>
                        <span>Opacity</span>
                    </div>
                    <input 
                        type="range" 
                        class="slider-input" 
                        id="opacitySlider" 
                        min="0" 
                        max="100" 
                        value="50"
                        oninput="updateOpacity(this.value)"
                    >
                    <div class="opacity-value">
                        <span id="opacityPercent">50</span>%
                    </div>
                </div>

                <!-- No Reference Message -->
                <div class="message" id="noRefMessage">
                    Add a reference image to get started
                </div>

                <!-- Control Buttons -->
                <div class="controls-buttons">
                    <button class="btn-circle" title="Switch Camera" onclick="switchCamera()">
                        <span class="icon">🔄</span>
                    </button>
                    <button class="btn-circle btn-capture" title="Capture Photo" onclick="capturePhoto()"></button>
                    <button class="btn-circle" title="Photo Library" onclick="openImagePicker()">
                        <span class="icon">🖼️</span>
                    </button>
                </div>

                <!-- Info Section -->
                <div class="info-section">
                    <strong>✅ Features Ready:</strong>
                    Upload photos • Adjust opacity • Live preview • Full UI
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="handleImageUpload(event)">

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>

    <script>
        let isFrontCamera = false;
        let hasReference = false;

        function openImagePicker() {
            document.getElementById('imageInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('referenceImage');
                img.src = e.target.result;
                
                hasReference = true;
                document.getElementById('referenceImage').style.display = 'block';
                document.getElementById('sliderContainer').classList.add('active');
                document.getElementById('noRefMessage').style.display = 'none';
                document.getElementById('clearBtn').style.display = 'flex';
                
                showStatus('Reference image added! ✓');
            };
            reader.readAsDataURL(file);

            event.target.value = '';
        }

        function updateOpacity(value) {
            document.getElementById('referenceImage').style.opacity = value / 100;
            document.getElementById('opacityPercent').textContent = value;
        }

        function clearReference() {
            document.getElementById('referenceImage').src = '';
            document.getElementById('referenceImage').style.display = 'none';
            hasReference = false;
            document.getElementById('sliderContainer').classList.remove('active');
            document.getElementById('noRefMessage').style.display = 'block';
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('opacitySlider').value = 50;
            updateOpacity(50);
            showStatus('Reference cleared');
        }

        function switchCamera() {
            isFrontCamera = !isFrontCamera;
            const placeholder = document.querySelector('.camera-placeholder');
            if (isFrontCamera) {
                placeholder.textContent = '🤳 Front Camera';
                showStatus('Front camera (simulator)');
            } else {
                placeholder.textContent = '📷 Back Camera';
                showStatus('Back camera (simulator)');
            }
        }

        function capturePhoto() {
            showStatus('📸 Photo captured!');
            
            const capture = document.querySelector('.btn-capture');
            capture.style.transform = 'scale(0.85)';
            setTimeout(() => {
                capture.style.transform = 'scale(1)';
            }, 150);
        }

        function showStatus(message) {
            const status = document.getElementById('statusMessage');
            status.textContent = message;
            status.classList.add('show');
            setTimeout(() => {
                status.classList.remove('show');
            }, 2500);
        }

        // Initialize
        document.getElementById('referenceImage').style.display = 'none';
        updateOpacity(50);

        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
